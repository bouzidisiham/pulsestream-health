[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsestream"
version = "0.1.0"
description = "Pipeline de surveillance santé en temps réel avec PySpark"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyspark==4.0.4",
    "faker==40.39.0",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "chispa==0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]